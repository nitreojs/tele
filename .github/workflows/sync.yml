name: Sync

# Moves UPSTREAM to the newest stable tdesktop release once the patches apply to it,
# then starts a build. Opens a `patch-conflict` issue when they don't.

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Look for a new stable release
        id: check
        run: |
          latest=$(gh api repos/telegramdesktop/tdesktop/releases/latest --jq .tag_name)
          current=$(tr -d '[:space:]' < UPSTREAM)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New release $latest (UPSTREAM is $current)"
          else
            echo "Up to date: UPSTREAM is $current, latest release is $latest"
            if [ "$latest" = "$current" ]; then
              bash ci/issue.sh close patch-conflict "UPSTREAM is $current now."
            fi
          fi

      - name: Clone tdesktop ${{ steps.check.outputs.latest }}
        if: steps.check.outputs.new == 'true'
        env:
          TAG: ${{ steps.check.outputs.latest }}
        run: |
          git -c advice.detachedHead=false clone --quiet --recurse-submodules --branch "$TAG" \
            https://github.com/telegramdesktop/tdesktop.git ../tdesktop

      - name: Apply patches
        id: apply
        if: steps.check.outputs.new == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tele.py apply 2>&1 | tee apply.log

      - name: Move UPSTREAM and start a build
        if: steps.apply.outcome == 'success'
        env:
          TAG: ${{ steps.check.outputs.latest }}
        run: |
          echo "$TAG" > UPSTREAM
          git add UPSTREAM
          git commit --quiet -m "upstream: $TAG"
          git push --quiet
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"
          bash ci/issue.sh close patch-conflict "Patches apply cleanly to $TAG."

      - name: Report conflicts
        if: failure() && steps.apply.outcome == 'failure'
        env:
          TAG: ${{ steps.check.outputs.latest }}
        run: |
          {
            echo "Telegram Desktop [$TAG](https://github.com/telegramdesktop/tdesktop/releases/tag/$TAG) is out, but the patches don't apply to it."
            echo
            echo '```'
            cat apply.log
            echo '```'
            echo
            echo 'Resolve it locally, in this repository:'
            echo
            echo '```'
            echo 'git pull'
            echo "python tele.py checkout $TAG"
            echo '# fix what it reports, git add, git am --continue, then: python tele.py continue'
            echo 'python tele.py export'
            echo 'git add -A UPSTREAM patches'
            echo "git commit -m \"patches: rebase onto $TAG\""
            echo 'git push'
            echo '```'
          } > issue.md
          bash ci/issue.sh open patch-conflict "Patches don't apply to $TAG" issue.md
